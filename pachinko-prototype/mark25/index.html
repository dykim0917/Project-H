<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312824"><title>별빛 회전극장 · MARK 2.5</title><link rel="stylesheet" href="style.css"></head>
<body><main aria-label="별빛 회전극장 마크2.5">
