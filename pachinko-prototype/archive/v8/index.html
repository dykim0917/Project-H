<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142338"><title>월면항로</title><style>
*{box-sizing:border-box}body{margin:0;background:#141c2c;color:#eaf0ff;font:14px system-ui;padding:12px}main{width:min(100%,500px);margin:auto}h1{font-size:25px;margin:0}small,.muted{color:#98abc6}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cabinet{position:relative;aspect-ratio:536/706;border:8px solid #748aaf;border-radius:90px 90px 36px 36px;background:radial-gradient(ellipse at 50% 30%,#344a67,#1b2c45);box-shadow:0 0 0 5px #101624,inset 0 0 60px #070e22;overflow:hidden}canvas{position:absolute;width:100%;height:100%;z-index:3;pointer-events:none}.screen{position:absolute;left:15.67%;top:20.40%;width:68.66%;height:42.35%;z-index:2;border:4px solid #aabbd1;border-radius:18px;background:radial-gradient(ellipse at 50% 120%,#91aabe 0 23%,#152940 24%,#091427 65%);overflow:hidden;text-align:center;box-shadow:0 0 25px #68b3ff25}.screen:before{content:'·    ✦      ·   ✧';position:absolute;inset:10px;color:#7698b6;letter-spacing:12px}.mode{position:relative;font-size:10px;letter-spacing:1px;padding-top:10px;color:#a4c5e9}.ship{position:absolute;left:calc(50% - 22px);top:25%;font-size:39px;transition:transform .6s;filter:drop-shadow(0 3px 9px #83c9ff)}.reels{position:absolute;top:49%;width:100%;display:flex;justify-content:center;gap:4px;font-size:40px;font-weight:900;text-shadow:0 3px #0b182f;color:#b9dfff}.reels span{width:44px}.caption{position:absolute;bottom:10px;width:100%;font-size:11px;font-weight:700}.logo{position:absolute;top:13%;left:33%;width:34%;text-align:center;font-size:22px;font-weight:800;color:#e7dbaa;z-index:4}.logo small{display:block;font-size:9px;letter-spacing:5px;margin-top:6px}.holds{position:absolute;top:64.6%;left:27%;width:52%;display:flex;gap:12px;justify-content:center;z-index:2}.hold{width:12px;height:12px;border-radius:50%;background:#101c30;border:2px solid #7389a5}.hold.blue{background:#68bcf5;box-shadow:0 0 10px #68bcf5}.hold-label{position:absolute;top:67%;left:44%;color:#91abc8;font-size:9px;z-index:2}.tray{position:absolute;bottom:5%;left:30%;width:42%;height:5%;border:3px solid #8eabc2;border-radius:10px 10px 30px 30px;background:linear-gradient(#142339,#385272);text-align:center;padding:4px;color:#bacce0;font-size:10px;opacity:.75}.screen.hot{border-color:#f27c71;box-shadow:0 0 35px #f26b6266}.screen.win{border-color:#f6d27a;box-shadow:0 0 45px #ffcb66}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#243348,#0d1420 75%)}.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:13px 4px;margin-bottom:10px;border:1px solid #52678077;border-radius:16px;background:linear-gradient(#263a51,#142338);box-shadow:0 4px 20px #0003;text-align:center}.hud>div+div{border-left:1px solid #7392ad33}.hud small{display:block;font-size:10px;letter-spacing:.08em;color:#9bb6cb}.hud strong{display:block;margin-top:4px;font:600 25px ui-monospace,monospace;color:#d6f0ec;font-variant-numeric:tabular-nums}.hud .reward{color:#e5cf97}.cabinet{margin:0 3px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 0}.actions{display:grid;gap:8px;flex:1;max-width:172px}.tools{display:flex;gap:6px}button{font:inherit;color:#d9e9f3;border:1px solid #657c9566;background:linear-gradient(#344b61,#213347);border-radius:11px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:hover{filter:brightness(1.15)}button:active{filter:brightness(1.35)}button:focus-visible,[role=slider]:focus-visible{outline:3px solid #efcd83;outline-offset:3px}.primary{min-height:47px;font-size:14px;font-weight:750;background:linear-gradient(#e1d5b4,#b7a577);color:#202c39;border-color:#f0dfb0}.primary[aria-pressed=true]{background:linear-gradient(#426879,#284554);color:#e3f3f5;border-color:#729eac}.tools button{min-width:44px;min-height:40px;flex:1;font-size:12px}.handle-control{display:flex;align-items:center;gap:5px}.arrow{display:grid;place-items:center;width:44px;height:62px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;border-color:#e4c37a88;background:linear-gradient(#715f3e,#3b352b);color:#ffdb82}.arrow svg{width:21px;height:28px;fill:currentColor;pointer-events:none}.handle{--angle:-35deg;position:relative;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#a2b4bf,#4d6473 40%,#172b3c 67%);border:4px solid #abbfc9;box-shadow:inset 0 0 0 4px #273b4a,0 5px 14px #0006}.handle-ring{position:absolute;inset:7px;border:1px dashed #a6c1cf88;border-radius:50%}.handle-grip{position:absolute;inset:6px;transform:rotate(var(--angle));pointer-events:none}.handle-grip:before{content:'';position:absolute;width:9px;height:23px;border-radius:5px;left:calc(50% - 4.5px);top:0;background:#f1d38a;box-shadow:0 0 8px #e7d29c55}.handle-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.power-value{font:600 17px ui-monospace,monospace;color:#f3ecdb;text-shadow:0 2px 3px #0008;font-variant-numeric:tabular-nums}.reels{--reel-height:42px}.reels>.reel{display:block;position:relative;width:44px;height:var(--reel-height);line-height:var(--reel-height);overflow:hidden;border-radius:6px;background:#0c1b2e44}.reels .reel-track{display:block;width:100%;animation:reel-scroll .3s linear infinite;filter:blur(.6px)}.reels .reel-digit{display:block;width:100%;height:var(--reel-height);line-height:var(--reel-height)}.reel.rolling:after{content:'';position:absolute;inset:0;background:linear-gradient(#09142799,transparent 30% 70%,#09142799);pointer-events:none}@keyframes reel-scroll{to{transform:translateY(-50%)}}@media(max-width:400px){body{padding:8px}.hud{padding:10px 2px}.hud strong{font-size:22px}.controls{gap:8px}.handle{width:86px;height:86px}.arrow{width:40px;height:56px}.power-value{font-size:15px}.reels{font-size:29px;--reel-height:34px;gap:0}.reels>.reel{width:32px}.mode{font-size:8px}.caption{font-size:9px}.logo{font-size:22px}.ship{font-size:31px}.hold-label{font-size:8px}}@media(max-width:360px){.controls{flex-wrap:wrap;justify-content:center}.actions{max-width:none;display:flex;flex:0 0 100%;align-items:center;gap:8px}.primary{flex:1}.tools{flex:0 0 144px}}@media(prefers-reduced-motion:reduce){.reels .reel-track{animation:none;filter:none}}
</style></head>
<body><main aria-label="월면항로 파칭코">
<div class="hud" aria-label="기계 상태"><div><small>회전</small><strong id="spins">0</strong></div><div><small>대당첨</small><strong id="wins">0</strong></div><div><small>획득 구슬</small><strong class="reward" id="paid">0</strong></div><div><small>ST</small><strong id="st">—</strong></div></div>
<div class="cabinet"><canvas id="board" aria-label="구슬이 핀과 벽에 부딪히며 헤소로 내려오는 판면"></canvas><div class="logo">☾ 월면항로<small>LUNAR ROUTE</small></div><div class="screen" id="screen"><div class="mode" id="mode">NORMAL · 1 / 99</div><div class="ship" id="ship">🚀</div><div class="reels"><span class="reel stopped" id="r0">0</span><span class="reel stopped" id="r1">0</span><span class="reel stopped" id="r2">0</span></div><div class="caption" id="caption">READY</div></div><div class="holds" id="holds" aria-label="대기 보류"></div><div class="hold-label" id="hold-label">보류 0 / 4</div><div class="tray">● ● ● ● ● ● ● ●</div></div>
<div class="controls"><div class="actions"><button class="primary" id="start" aria-pressed="false">발사 시작</button><div class="tools"><button id="sound" aria-label="소리" aria-pressed="true">소리 ON</button><button id="speed" aria-label="전체 속도">×1</button><button id="reset" aria-label="기록 초기화" title="초기화">↺</button></div></div>
<div class="handle-control" role="group" aria-label="발사 세기"><button class="arrow" id="power-minus" aria-label="발사 세기 줄이기"><svg viewBox="0 0 24 32" aria-hidden="true"><path d="M20 2 3 16l17 14Z"/></svg></button><div id="handle" class="handle" role="slider" tabindex="0" aria-label="발사 세기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="36"><span class="handle-ring"></span><span class="handle-grip"></span><span class="handle-center"><strong id="power-value" class="power-value">36.0%</strong></span></div><button class="arrow" id="power-plus" aria-label="발사 세기 늘리기"><svg viewBox="0 0 24 32" aria-hidden="true"><path d="m4 2 17 14L4 30Z"/></svg></button></div></div>
</main><script src="physics.js"></script><script src="sound.js"></script><script src="app.js"></script></body></html>
